<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=3.0, user-scalable=yes" />
  <title>Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://accounts.google.com" />
  <link rel="preconnect" href="https://www.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <main id="app" class="glass-card">
    <div id="loginView">
      <div class="lock-icon-wrap">
        <div id="lock-glow" class="lock-glow"></div>
        <div class="lock-emoji">🔐</div>
      </div>
      <h1>Welcome</h1>
      <p class="subtitle">Sign in with Google to continue.</p>

      <!-- Google Sign-In Container / Custom Button Wrapper -->
      <div id="googleBtnWrapper">
        <div id="googleBtn" class="google-btn-loading" aria-busy="true"></div>
      </div>

      <p id="error" class="error" hidden></p>
    </div>

    <div id="welcomeView" class="welcome" hidden>
      <div class="avatar" id="avatar"></div>
      <h1>Welcome, <span id="userName"></span>!</h1>
      <p class="welcomeSub" id="userEmail"></p>

      <div id="shopView" class="shop">
        <div id="shopGrid" class="shop-grid"></div>
      </div>

      <button id="logoutBtn" class="btn btn-logout">Logout</button>
    </div>
  </main>

  <!-- Checkout Modal -->
  <div id="checkoutModal" class="modal-overlay" hidden>
    <div class="modal-content">
      <img id="checkoutImg" class="checkout-img" alt="" />
      <h2 id="checkoutTitle">Checkout</h2>
      <p id="checkoutDesc" class="subtitle" style="font-size:13px; margin-bottom:4px;"></p>
      <p id="checkoutPrice" class="subtitle" style="margin-bottom:0;">Select a payment method</p>
      <div class="payment-options">
        <button id="payPayMongo" class="pay-btn paymongo">Pay with PayMongo (GCash / Maya / Card)</button>
        <button id="payPayPal" class="pay-btn paypal">Pay with PayPal</button>
      </div>
      <button id="closeCheckout" class="pay-btn" style="margin-top:12px;">Cancel</button>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="app.js"></script>
</body>
</html>
