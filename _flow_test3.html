<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flow Test</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>
<div id="loginScreen" class="login-screen">
  <main class="login-card">
    <div id="loginView">
      <div class="login-brand"><div class="brand-mark">✦</div><h1>Welcome</h1></div>
      <p class="subtitle">Sign in with Google to continue.</p>
      <div id="googleBtnWrapper"><div id="googleBtn"></div></div>
      <p id="error" class="error" hidden></p>
    </div>
  </main>
</div>
<script>
window.google = { accounts: { id: {
  initialize(){},
  renderButton(el, opts){ el.innerHTML = '<button id="real-google-btn" style="padding:12px 24px;background:#1a73e8;color:white;border:none;border-radius:8px;cursor:pointer;">Continue with Google</button>'; el._callback = opts.callback; },
  disableAutoPrompt(){}
} } };
</script>
<script src="app.js"></script>
<script>
const out = [];
setTimeout(() => {
  out.push("=== Page loaded ===");
  out.push("loginScreen hidden: " + document.getElementById("loginScreen").hidden);
  out.push("googleBtn children: " + document.getElementById("googleBtn").children.length);
  out.push("error text: " + JSON.stringify(document.getElementById("error").textContent));

  const btn = document.getElementById("real-google-btn");
  if (btn) {
    out.push("Clicking Google button...");
    const fakeToken = "eyJhbGciOiJSUzI1NiIsImtpZCI6ImZha2Uta2lkIn0.eyJpc3MiOiJodHRwczovL2FjY291bnRzLmdvb2dsZS5jb20iLCJhdWQiOiIyODk4NDMyNTA2NzktdmJmNnU5cWo4cWVwYzllMmNmZnZndTV1jY3JpNzJwcy5hcHBzLmdvb2dsZWJ1Y29udGVudC5jb20iLCJleHAiOjE3Njc4NTAwMDAsImlhdCI6MTc2Nzg0NjQwMH0. signaturesig";
    if (window.google && window.google.accounts && window.google.accounts.id && window.google.accounts.id._callback) {
      window.google.accounts.id._callback({ credential: fakeToken });
      out.push("Callback invoked");
    } else { out.push("No callback found"); }
  } else { out.push("No Google button found"); }

  setTimeout(() => {
    out.push("=== After verification (3s) ===");
    out.push("loginScreen hidden: " + document.getElementById("loginScreen").hidden);
    out.push("dashboardScreen hidden: " + document.getElementById("dashboardScreen").hidden);
    out.push("error text: " + JSON.stringify(document.getElementById("error").textContent));
    document.body.innerHTML = '<pre style="font:13px monospace;color:#fff;background:#000;padding:10px;white-space:pre-wrap;">' + out.join('\n') + '</pre>';
  }, 3000);
}, 500);
</script>
</body></html>
