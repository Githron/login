<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <main id="app" class="glass-card">
    <div id="loginView">
      <div class="lock-icon-wrap">
        <div class="lock-glow"></div>
        <div class="lock-emoji">🔐</div>
      </div>
      <h1>Welcome</h1>
      <p class="subtitle">Sign in with Google to continue.</p>

      <!-- Google Sign-In Container / Custom Button Wrapper -->
      <div id="googleBtnWrapper">
        <div id="googleBtn"></div>
      </div>

      <p id="error" class="error" hidden></p>
    </div>

    <div id="welcomeView" class="welcome" hidden>
      <div class="avatar" id="avatar"></div>
      <h1>Welcome, <span id="userName"></span>!</h1>
      <p class="welcomeSub" id="userEmail"></p>
      <button id="logoutBtn" class="btn btn-logout">Logout</button>
    </div>
  </main>

  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="app.js"></script>
</body>
</html>
